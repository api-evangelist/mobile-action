generated: '2026-08-13'
method: searched
source: https://docs.mobileaction.co/guide/introduction
docs: https://docs.mobileaction.co/guide/introduction
model: credit-quota
model_note: 'MobileAction does not publish a requests-per-second/minute rate limit. Usage is metered as
  CREDITS: each account has a credit total per reset period (hours), each endpoint costs a published number
  of credits per request (1-200), and the balance is returned on every successful response as headers.'
headers:
- name: X-Credit-Cost
  meaning: Credits the endpoint charged for this request
  observed: true
  observed_note: 'Observed on a live unauthenticated probe: GET https://api.mobileaction.co/appstore-keyword-ranking/284882215/US/top-keywords
    returned HTTP 401 with x-credit-cost: 20, so the cost header is emitted even when the call is rejected.'
- name: X-Credit-Remaining
  meaning: Credits left in the current period
- name: X-Credit-Reset
  meaning: Seconds until the credit allotment resets
retry_after: false
standard_ratelimit_headers: false
standard_ratelimit_headers_note: No RateLimit-* (RFC 9331 draft) or X-RateLimit-* headers were observed
  or documented.
exhaustion_status: null
exhaustion_note: The docs do not state the status code returned when credits are exhausted, and it cannot
  be observed without an authenticated key. Recorded as unknown rather than guessed.
balance_endpoint:
  method: GET
  path: /api-key
  credits: 0
  response_fields:
    creditTotal: Total credits per period
    creditRemaining: Remaining credits for the current period
    creditResetPeriod: Credit period in hours
    creditResetTime: Remaining credit reset time in seconds
  example_response:
    success: true
    data:
      creditTotal: 4000
      creditRemaining: 3012
      creditResetPeriod: 24
      creditResetTime: 511
  note: The documented example shows a 4,000-credit allowance on a 24-hour reset period; the actual allowance
    is set per contract.
shared_with_mcp: true
shared_with_mcp_note: Calls made through the remote MCP server (https://mcp.mobileaction.co/mcp) draw
  from the SAME credit allowance as direct REST calls, and every MCP result carries a credits object with
  cost, remaining balance and reset time.
