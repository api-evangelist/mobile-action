- name: MobileAction MCP Server
  description: >-
    Remote Model Context Protocol server exposing 88 MobileAction tools (App
    Store and Google Play keyword/category/app intelligence, Ad Intelligence, CPP
    Intelligence, Dashboard, Search Ads and utility services) over streamable
    HTTP at MCP protocol 2025-06-18. Authenticated by appending the account API
    token to the endpoint URL; calls draw from the same credit allowance as the
    REST API. tools/list answers anonymously with full input schemas.
  humanURL: https://docs.mobileaction.co/mcp/server-setup
