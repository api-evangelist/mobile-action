aid: mobile-action
name: Mobile Action
description: >-
  MobileAction is an app-store marketing intelligence platform used by 5,000+
  mobile app and game companies for App Store Optimization (ASO), Apple Ads
  campaign management (CMP), ad-creative intelligence across 90M+ creatives, CPP
  (Custom Product Page) intelligence and market benchmarking. It is an InMobi
  Advertising company. MobileAction publishes two machine surfaces over the same
  intelligence core and the same credit allowance: a credit-metered REST API at
  https://api.mobileaction.co, authenticated with a per-account API key passed as
  the `token` query parameter, covering App Store and Google Play keyword and
  category rankings, app metadata and version timelines, reviews and review word
  analysis, download/revenue estimations, ad creatives, Apple Ads reporting and
  dashboard data; and a remote MCP server at https://mcp.mobileaction.co/mcp
  exposing 88 tools whose catalogue is readable anonymously. No OpenAPI document
  is published. API access is enterprise-only, arranged through sales, with keys
  issued by a Customer Success Manager. Backed by 500 Global.
