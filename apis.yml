aid: mobile-action
name: Mobile Action
description: >-
  MobileAction is an app-store marketing intelligence platform used by 5,000+
  mobile app and game companies for App Store Optimization (ASO), Apple Search
  Ads campaign management (CMP), ad-creative intelligence across 100M+ creatives,
  and market benchmarking. Its products include MobileAction AI, ASO
  Intelligence, Ad Intelligence, Market Intelligence, CPP Intelligence, and
  managed ASO/Apple Ads services. The MobileAction API exposes this intelligence
  programmatically over a credit-metered REST interface at
  https://api.mobileaction.co, authenticated with a per-account API key passed as
  the `token` query parameter, spanning App Store and Google Play keyword
  rankings, app metadata, ad creatives, Search Ads, and dashboard data. Backed by
  500 Global.
