generated: '2026-08-13'
method: searched
status: published
source: https://docs.mobileaction.co/mcp/server-setup
deployment:
  mode: remote
  endpoint: https://mcp.mobileaction.co/mcp
  auth: api-key
  auth_note: 'The account API token is appended to the endpoint as a ?token= query parameter (https://mcp.mobileaction.co/mcp?token=YOUR-API-TOKEN).
    MobileAction documents the tokened URL as a credential: "Anyone with this link can query your MobileAction
    data, so treat it like a password." No OAuth is offered — /.well-known/oauth-authorization-server
    and /.well-known/oauth-protected-resource both return 404 on the MCP host.'
  verified: probed
server:
  name: MobileAction
  version: 3.4.7
  transport: http
  protocol_version: '2025-06-18'
  url: https://mcp.mobileaction.co/mcp
  capabilities:
  - tools
  - prompts
  - resources
  - logging
  - experimental
  - io.modelcontextprotocol/ui
  instructions: 'Tools for the MobileAction API: App Store & Google Play keyword/category/app intelligence,
    Ad Intelligence, CPP Intelligence, Dashboard, Search Ads and utility services. Every call spends credits
    from the caller''s API key; the credit cost is stated in each tool description and every result contains
    a ''credits'' object with the cost, remaining balance and reset time. Prefer cheap tools first and
    check remaining credits with get_credit_status when planning many calls.'
clients_documented:
- client: Claude (web, desktop, mobile)
  method: custom connector
  docs: https://docs.mobileaction.co/mcp/connect-to-claude
- client: ChatGPT (web)
  method: custom app / Developer mode
  docs: https://docs.mobileaction.co/mcp/connect-to-chatgpt
- client: Gemini CLI
  method: mcpServers entry in settings file
  docs: https://docs.mobileaction.co/mcp/connect-to-gemini-cli
metering:
  model: credits
  note: MCP calls draw from the same credit allowance as direct REST calls. Each tool description states
    its credit cost and every result carries a credits object (cost, remaining balance, reset time).
  balance_tool: get_credit_status
requirements:
- Active MobileAction API Solutions plan
- MobileAction API key issued by a Customer Success Manager
tool_count: 88
