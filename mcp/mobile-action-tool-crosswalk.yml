notes:
- 'The MCP tool surface is a near-complete projection of the documented REST surface: every one of the
  88 tools maps to a published endpoint, and no tool was found that has no REST counterpart.'
- Tool inputSchemas use snake_case (track_id, country_code, start_date) while the REST reference uses
  camelCase path/query names (trackId, countryCode, startDate). The MCP server performs that renaming;
  a crosswalk row lists the MCP parameter names under inputs.
- Credit cost is carried in the tool description text itself and is identical to the per-endpoint credit
  table in the REST introduction guide.
